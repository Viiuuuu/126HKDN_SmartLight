<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartLight - Hệ Thống Quản Lý Chiếu Sáng Công Cộng | EVNCPC</title>
  <meta name="description" content="Đăng nhập hệ thống điều khiển và quản lý chiếu sáng công cộng thông minh EVNCPC SmartLight.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css?v=2">
</head>
<body>
  <div class="login-page-wrapper">
    <!-- Background Image Layer -->
    <div class="bg-image-layer" style="background-image: url('images/background.png');"></div>

    <!-- Main Content Container -->
    <div class="login-container">
      
      <!-- Left Hero Column -->
      <section class="hero-section">
        <!-- Top Title & Subtitle -->
        <div class="hero-header">
          <h1 class="brand-title">SmartLight</h1>
          <div class="brand-tagline">
            <span>HỆ THỐNG QUẢN LÝ</span>
            <span>CHIẾU SÁNG CÔNG CỘNG</span>
          </div>
        </div>

        <!-- Bottom Quote / Vision Section -->
        <div class="hero-quote-box">
          <h2 class="quote-heading">
            CHIẾU SÁNG THÔNG MINH<br>
            KHẲNG ĐỊNH TẦM NHÌN
          </h2>
          <p class="quote-desc">
            “Tối ưu hóa vận hành chiếu sáng đô thị, giảm thiểu hao phí năng lượng và xây dựng không gian sống an toàn, hiện đại.”
          </p>
        </div>
      </section>

      <!-- Right Login Card Column -->
      <section class="auth-section">
        <div class="login-card">
          <!-- EVNCPC Logo -->
          <div class="logo-box">
            <img src="images/logo.png" alt="EVNCPC Logo" class="evn-logo" id="evnLogo">
          </div>

          <!-- Card Header Title -->
          <h2 class="card-login-title">ĐĂNG NHẬP</h2>

          <!-- Alert Notice Box (Hidden by default) -->
          <div class="alert-message" id="alertMessage" role="alert"></div>

          <!-- Login Form -->
          <form class="login-form" id="loginForm" autocomplete="on">
            <!-- Username Input -->
            <div class="form-group">
              <div class="input-wrapper">
                <input 
                  type="text" 
                  id="username" 
                  name="username" 
                  class="form-control" 
                  placeholder="Tên đăng nhập" 
                  required 
                  autocomplete="username"
                >
              </div>
            </div>

            <!-- Password Input with Toggle -->
            <div class="form-group">
              <div class="input-wrapper">
                <input 
                  type="password" 
                  id="password" 
                  name="password" 
                  class="form-control" 
                  placeholder="Mật khẩu" 
                  required 
                  autocomplete="current-password"
                >
                <button type="button" class="btn-toggle-pwd" id="btnTogglePassword" aria-label="Hiện/Ẩn mật khẩu" title="Hiện/Ẩn mật khẩu">
                  <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Options Row (Remember me + Forgot password) -->
            <div class="form-options-row">
              <label class="remember-checkbox-label" for="rememberMe">
                <input type="checkbox" id="rememberMe" name="rememberMe" checked>
                <span class="custom-checkmark"></span>
                <span class="remember-text">Ghi nhớ đăng nhập</span>
              </label>

              <a href="#forgot-password" class="forgot-pwd-link" id="linkForgotPassword">Quên mật khẩu?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-login-submit" id="btnLogin">
              <span class="btn-text">Đăng nhập</span>
              <span class="spinner" id="loginSpinner"></span>
            </button>

            <!-- Bottom Support & Policy Link -->
            <div class="login-card-footer">
              <a href="#policy" class="policy-link" id="linkPolicy">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Trợ giúp/Quy tắc chính sách bảo mật và phân quyền người dùng</span>
              </a>
            </div>
          </form>
        </div>
      </section>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
